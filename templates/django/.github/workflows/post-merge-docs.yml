name: Post-Merge Docs Update

# 브랜치를 고정하지 않는다. 이전 버전은 `branches: [dev, prod]` 였는데, 주입 대상
# 레포는 대개 main/develop 을 쓰므로 워크플로가 아예 돌지 않았다.
#
# 그렇다고 모든 머지에 반응하면 스택 PR 의 중간 머지마다 이슈가 생긴다. 그래서
# 필터는 `on:` 이 아니라 아래 job 조건에 두고, 기준 브랜치를 하드코딩하는 대신
# 레포의 기본 브랜치(`repository.default_branch`)를 런타임에 읽는다.

on:
  pull_request:
    types: [closed]

jobs:
  update-docs:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # views.py 변경 여부 감지
          if echo "$CHANGED" | grep -q "views.py"; then
            echo "has_view_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_view_changes=false" >> $GITHUB_OUTPUT
          fi

          # CLAUDE.md 변경 여부 감지
          if echo "$CHANGED" | grep -q "CLAUDE.md"; then
            echo "has_claude_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_claude_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create API docs update PR (if views changed)
        if: steps.changed.outputs.has_view_changes == 'true'
        uses: actions/github-script@v7
        # 파일명은 PR 작성자가 정한다. Actions 표현식으로 스크립트에 직접 보간하면
        # 백틱이나 ${ 가 들어간 파일명으로 빠져나가 임의 코드가 실행된다.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const changedFiles = process.env.CHANGED_FILES || '';

            const viewFiles = changedFiles.split('\n')
              .filter(f => f.includes('views.py'))
              .map(f => `- \`${f}\``)
              .join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DOCS] API 문서 갱신 필요 — #${prNumber} ${prTitle}`,
              body: [
                '## 개요',
                `PR #${prNumber} 머지로 인해 아래 views.py 파일이 변경되었습니다.`,
                '`docs/api/` 문서를 현재 코드와 동기화해주세요.',
                '',
                '## 변경된 Views 파일',
                viewFiles,
                '',
                '## 작업 방법',
                '1. 각 views.py의 엔드포인트 변경사항 확인',
                '2. `docs/api/{app}.md` 파일 갱신 (추가·수정·삭제된 엔드포인트 반영)',
                '3. 이 이슈를 참조하는 PR 생성 후 머지',
                '',
                '> 이 이슈는 `post-merge-docs.yml` 워크플로우에 의해 자동 생성되었습니다.'
              ].join('\n'),
              labels: ['documentation']
            });
