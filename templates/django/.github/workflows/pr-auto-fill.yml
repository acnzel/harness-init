name: Auto-fill PR Body

# 마커(harness:pr) 사이만 갱신한다. 사람이 쓴 내용은 건드리지 않는다.
#
# 이전 버전은 PR 본문을 통째로 덮어썼다. 작성자가 템플릿을 채워 PR 을 열면 그 내용이
# 그대로 사라졌다. 또 OpenAI 로 diff 를 요약했는데, 리뷰어는 diff 를 직접 읽을 수
# 있으므로 얻는 게 적고 환각 위험만 남았다. 이제 LLM 없이 git·gates.json 에서
# 기계적으로 얻는 사실만 적는다 (API 키 불필요).
#
# 브랜치를 고정하지 않는다. 이전 버전은 `branches: [prod, dev]` 라 main/develop 을
# 쓰는 대부분의 레포에서 아예 돌지 않았다.
#
# pull_request 를 쓴다. pull_request_target 은 fork PR 에서 시크릿을 노출할 수 있어
# 본문 채우기 정도에 쓸 이유가 없다. 대신 fork PR 에서는 write 권한이 없어 건너뛴다.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-fill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fill:
    # fork PR 은 GITHUB_TOKEN 이 읽기 전용이라 편집이 실패한다. 조용히 건너뛴다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and update body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f .claude/scripts/pr-body.py ]; then
            echo "pr-body.py 없음 — 하네스 미설치로 보고 건너뜁니다"
            exit 0
          fi
          gh pr view "$PR" --json body -q .body > current.md
          python3 .claude/scripts/pr-body.py \
            --base "$BASE" --head "$HEAD" --repo . --body-file current.md > new.md
          if cmp -s current.md new.md; then
            echo "변경 없음"
          else
            gh pr edit "$PR" --body-file new.md
            echo "자동 수집 구간 갱신"
          fi
