name: PR Gates

# 검사 목록은 여기가 아니라 .claude/gates.json 에 있다.
# 로컬 pre-push 와 CI 가 **같은 러너·같은 선언**을 써야 "로컬은 통과했는데 CI 가
# 깨지는" 드리프트가 안 생긴다. 검사를 추가하려면 이 파일이 아니라 gates.json 을 고친다.
#
# 브랜치를 고정하지 않는다. 이전 버전은 `branches: [dev]` 였는데, 주입 대상 레포는
# 대개 main/develop 을 쓰므로 워크플로가 아예 돌지 않았다.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: 통합 게이트 (ci)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # --no-fail-fast: CI 에서는 실패를 한 번에 다 보여준다. 하나씩 고치며
      # 재실행하는 것보다 낫다. 로컬 pre-push 는 반대로 fail-fast 가 기본이다.
      - name: Run gates
        env:
          PYTHONUNBUFFERED: 1
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || 'config.settings.test' }}
          SECRET_KEY: test_secret_key
        run: python3 .claude/scripts/gate-runner.py --stage ci --no-fail-fast
