# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit 설정. Gemini Code Assist 는 개인 사용자에게 더 이상 무료로 제공되지
# 않아 CodeRabbit 으로 대체했다 (harness-init 1.2.0). GitHub App 설치만으로 동작
# 하고 별도 워크플로 파일이 필요 없다 — https://github.com/marketplace/coderabbitai
# 에서 레포에 설치할 것. (PR 자동 코드 리뷰는 `claude-code-review.yml` 이 별도로
# 돌린다 — 이 설정과 무관하다.)
#
# 정본 관계: 레이어드 아키텍처·테스트 규칙의 정본은 `.claude/rules/architecture.md`·
# `testing.md` 다. CodeRabbit 은 CLAUDE.md·AGENTS.md 는 자동으로 인식하지만
# `.claude/rules/*` 는 자동 인식 목록에 없어서, 아래 knowledge_base.code_guidelines
# .filePatterns 로 명시적으로 참조를 걸어 둔다 — 내용을 옮겨 적지 않고 참조만 한다.
# path_instructions 에는 저 두 파일에 없는, CodeRabbit 리뷰 전용 지침(KISS/YAGNI/DRY
# 억제 기준, 리뷰 코멘트 레벨, 타입 안전성·에러 핸들링·네이밍처럼 이 프로젝트 규칙
# 문서엔 없는 세부 관례)만 남긴다. `.claude/rules/*` 를 고치면 이 파일은 자동으로
# 최신을 참조하므로 같이 고칠 필요가 없다 — 남은 path_instructions 를 고칠 때만
# 규칙 문서와 내용이 겹치지 않는지 확인할 것.

language: "ko-KR"

knowledge_base:
  code_guidelines:
    filePatterns:
      - files: ".claude/rules/architecture.md"
        applyTo: "**/*.{ts,tsx}"
      - files: ".claude/rules/testing.md"
        applyTo: "**/*.{ts,tsx}"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    # 의존성 / 빌드
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/.nuxt/**"
    - "!**/coverage/**"
    # IDE / 에디터
    - "!**/.idea/**"
    - "!**/.vscode/**"
    - "!**/.DS_Store"
    # 문서 / AI 설정 (리뷰 불필요)
    - "!**/docs/**"
    - "!**/.claude/**"
    - "!**/CLAUDE.md"
    - "!**/AGENTS.md"
    # 데이터 / 덤프
    - "!**/*.sql"
    - "!**/*.gz"

  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: |
        ## Critical Rules (반드시 준수)

        App Router 레이어드 아키텍처(Page/Route Handler/Server Action → Service →
        Repository)와 테스트 데이터 생성(Factory/Builder 전용) 규칙은 knowledge_base 로
        참조하는 `.claude/rules/architecture.md`·`testing.md` 를 따를 것 — 위반 시 그
        문서를 근거로 지적한다.

        ### 1. Type Safety (필수)
        모든 함수/메서드에 타입 명시 필수 (strict mode). 암묵적 `any` 는 지적할 것.

        ### 2. Error Handling
        `catch (e) {}` 처럼 예외를 삼키는 코드를 지적할 것.

        ## 네이밍 컨벤션
        컴포넌트 PascalCase, 함수/변수 camelCase, 상수 UPPER_SNAKE_CASE, 파일명
        kebab-case (Next.js 예약 파일명 `page.tsx`/`layout.tsx`/`route.ts`/`actions.ts`
        제외).

        ## KISS / YAGNI / DRY — 리뷰 원칙 (과도한 추상화 제안 자제)

        다음은 제안하지 말 것 (SKIP):
        - 1곳에서만 쓰이는 코드에 추상화 추가 (YAGNI)
        - 아직 없는 Factory/Helper 클래스 신규 생성 요구 — 2곳 이상 쓰일 때만 분리
        - "나중에 필요할 수도 있으니" 방어 설계 제안
        - 단순한 코드를 복잡하게 만드는 리팩토링 (50줄을 100줄로 만들면 퇴보)
        - 가능한 시나리오가 없는 에러 핸들링 추가
        - 중복 제거가 오히려 복잡성을 높이는 DRY 제안 (KISS 우선)

        다음은 반드시 지적할 것 (HIGH priority):
        - 기존 코드베이스에 이미 있는 유틸리티를 새로 구현하는 코드
        - 타입 누락, `any` 남용
        - Server Component(`page.tsx` 등)에 `"use client"` 없이 브라우저 전용 API 사용

        ## 리뷰 코멘트 레벨
        L1 요청사항(보안/버그/아키텍처 위반, 반드시 수정) · L2 권고사항(성능/타입) ·
        L3 질문사항(의도 확인) · L4 변경제안 · L5 참고의견(스타일/네이밍).
